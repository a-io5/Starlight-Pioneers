- type: entity
  parent: BaseResomiPlushie
  id: PlushiePeep
  name: peep plushie
  description: A soft resomi plushie of Peep.
  components:
  - type: Item
    size: Small
    sprite: _pioneers/Objects/Fun/Plushies/peep_plushie.rsi
  - type: Sprite
    sprite: _pioneers/Objects/Fun/Plushies/peep_plushie.rsi
    layers:
      - state: icon
  - type: ItemToggle
    onUse: false
    verbToggleOn: plushie-voicebox-activate
    verbToggleOff: plushie-voicebox-deactivate
  - type: ComponentToggler
    components:
      - type: DatasetVocalizer
        dataset: PlushiesPeep
      - type: TextToSpeech
        voice: bettylabomba
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: PeepJuice
        Quantity: 30

